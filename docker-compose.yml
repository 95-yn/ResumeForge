# ResumeForge —— 一条命令起服务：docker compose up -d --build
# 改端口：HOST_PORT=8080 docker compose up -d --build
services:
  web:
    build: .
    image: resumeforge
    container_name: resumeforge
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
