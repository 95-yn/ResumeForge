<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <!-- 简历纸：单层竖版容器 -->
  <rect x="7" y="3.5" width="18" height="25" rx="1.5" fill="#F5F1E8" stroke="#2D1810" stroke-width="1.25"/>
  <!-- 抬头分隔线 -->
  <line x1="10.5" y1="9" x2="18" y2="9" stroke="#2D1810" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>
  <!-- RF 衬线字标（Fraunces 未加载时回退 Georgia） -->
  <text x="16" y="22.2" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="600" font-size="13" letter-spacing="-0.6" fill="#2D1810">RF</text>
  <!-- 套准点：印刷工艺记号 -->
  <circle cx="22" cy="6.5" r="1.5" fill="#1E5A6B"/>
</svg>
