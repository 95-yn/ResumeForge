<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 深色底：浏览器标签页里高对比、易识别 -->
  <rect width="32" height="32" rx="6" fill="#2D1810"/>
  <!-- 简历纸（奶白） -->
  <rect x="8" y="5" width="16" height="22" rx="1.5" fill="#F5F1E8"/>
  <!-- 抬头分隔线 -->
  <line x1="11" y1="10" x2="17" y2="10" stroke="#2D1810" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
  <!-- RF 衬线字标（图标语境用系统衬线 Georgia 兜底） -->
  <text x="16" y="22" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="11" letter-spacing="-0.5" fill="#2D1810">RF</text>
  <!-- 套准点 -->
  <circle cx="20.5" cy="8" r="1.7" fill="#1E5A6B"/>
</svg>
