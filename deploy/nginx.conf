# ResumeForge —— nginx 反向代理参考配置（resume.yyyyn.cn）
# 用法：把本段放进你的 server {} 里（或 include 此文件），改好证书路径后 nginx -t && nginx -s reload。
# 职责分工：Next 负责 Cache-Control（见 next.config.mjs），nginx 负责压缩 / HTTP2 / 反代，互不重复。

server {
    listen 443 ssl http2;          # 开 HTTP/2，多图并发更快
    server_name resume.yyyyn.cn www.resume.yyyyn.cn;

    ssl_certificate     /path/to/resume.yyyyn.cn.pem;
    ssl_certificate_key /path/to/resume.yyyyn.cn.key;

    # PDF 导出(/api/pdf)会 POST 一份自包含 HTML;带 base64 内联头像时可能超过
    # nginx 默认 1MB 上限被拦成 413。放宽到 10MB(应用层另有 8MB 上限兜底)。
    client_max_body_size 10m;

    # ---- 文本压缩（JS/CSS/HTML/JSON/SVG 是大头；图片已压过，不重复压）----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml font/woff2;
    # 装了 brotli 模块的话再加（比 gzip 更小）：
    # brotli on; brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    # ---- 反代到容器里的 Next standalone（端口 3000）----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Cache-Control 由 Next 下发，这里透传即可，不覆盖。
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name resume.yyyyn.cn www.resume.yyyyn.cn;
    return 301 https://$host$request_uri;
}
